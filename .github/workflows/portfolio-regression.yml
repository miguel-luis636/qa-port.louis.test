name: Portfolio regression

on:
  push:
    branches: [feat/cyberpunk-qa-portfolio]
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/portfolio-regression.yml'
  pull_request:
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/portfolio-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-playwright-report
          path: |
            portfolio-site/playwright-report/
            portfolio-site/test-results/
          retention-days: 7
